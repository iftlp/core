stages:
  - build
  - sonarqube-check
  - publish

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  PROJECT_PATH: "Sources/Shizima.CoreLib"
  GROUP_NUGET_REGISTRY: "https://gitlab.isima.fr/api/v4/projects/9407/packages/nuget"
  PACKAGE_NAME: "Shizima.CoreLib"

before_script:
  - dotnet --version

build:
  image: mcr.microsoft.com/dotnet/sdk:8.0
  stage: build
  script:
    - VERSION="1.0.$CI_PIPELINE_ID"
    - dotnet restore $PROJECT_PATH
    - dotnet build $PROJECT_PATH --no-restore --configuration Release
    - dotnet pack $PROJECT_PATH --configuration Release --output ./packages /p:PackageVersion=$VERSION
  artifacts:
    paths:
      - ./packages/*.nupkg
    expire_in: 1 hour

sonarqube-check:
  image: mcr.microsoft.com/dotnet/sdk:8.0
  stage: sonarqube-check
  dependencies:
    - build
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:  
      - .sonar/cache
  script: 
      - "cd $PROJECT_PATH"
      - "apt-get update"
      - "apt-get install --yes default-jre"
      - "dotnet tool install --global dotnet-sonarscanner"
      - "export PATH=\"$PATH:$HOME/.dotnet/tools\""
      - "dotnet sonarscanner begin /k:\"shizima.corelib\" /d:sonar.login=\"$SONAR_TOKEN\" /d:\"sonar.host.url=$SONAR_HOST_URL\" "
      - "dotnet build"
      - "dotnet sonarscanner end /d:sonar.login=\"$SONAR_TOKEN\""
  allow_failure: true
  only:
    - master

publish:
  image: mcr.microsoft.com/dotnet/sdk:8.0
  stage: publish
  dependencies:
    - build
    - sonarqube-check
  script:
    - dotnet nuget push "./packages/*.nupkg" --source "$GROUP_NUGET_REGISTRY" --api-key "$CI_JOB_TOKEN" --skip-duplicate
  only:
    - master